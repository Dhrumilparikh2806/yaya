version: "3.9"

# Production Docker Compose — Oracle Cloud ARM (4 OCPUs, 24 GB RAM)
#
# Services:
#   api      — FastAPI server  (port 8000, public)
#   worker   — Celery task processor
#   postgres — PostgreSQL 16   (internal only)
#   redis    — Redis 7         (internal only, Celery broker + BM25 cache + agent sessions)
#   chromadb — ChromaDB HTTP   (internal only, vector store)
#
# Start:  docker compose -f docker-compose.prod.yml up -d
# Logs:   docker compose -f docker-compose.prod.yml logs -f
# Stop:   docker compose -f docker-compose.prod.yml down

services:

  # ── FastAPI ──────────────────────────────────────────────────────────────────
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - uploads:/tmp/geminirag_uploads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  # ── Celery worker ─────────────────────────────────────────────────────────────
  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - uploads:/tmp/geminirag_uploads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 8G   # ML models (fastembed + SpeechBrain + cross-encoder) need headroom

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geminirag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geminirag}
      POSTGRES_DB: ${POSTGRES_DB:-geminirag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geminirag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ── ChromaDB ──────────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chromadata:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v2/heartbeat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G

volumes:
  pgdata:
  redisdata:
  chromadata:
  uploads:
